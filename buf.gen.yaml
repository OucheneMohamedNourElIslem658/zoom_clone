# buf.gen.yaml
version: v1
plugins:
  - name: ts_proto
    # Use the absolute path to protoc-gen-ts_proto.cmd
    # Adjust path if buf.gen.yaml is not in the project root.
    path: "M:\\Documents\\typescript\\zoom_clone\\node_modules\\.bin\\protoc-gen-ts_proto.cmd"
    out: src/api/pb
    # outputServices should typically be a single value for ts-proto.
    # 'nice-grpc' often includes sufficient definitions for the client.
    opt:
      - outputServices=nice-grpc,outputServices=generic-definitions
      - useExactTypes=false